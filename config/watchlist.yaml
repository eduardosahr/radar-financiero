# Lista de seguimiento del Radar Financiero.
# Para agregar un activo, copia una línea y cambia el ticker (formato de Yahoo Finance).

precios:
  historia_inicial: "2020-01-01"   # desde cuándo descargar la primera vez

  indices_y_mercados:
    "^MXX": S&P/BMV IPC
    "^GSPC": S&P 500
    "^VIX": VIX (volatilidad S&P 500)
    "MXN=X": USD/MXN
    "CL=F": Petróleo WTI
    "GC=F": Oro

  emisoras:
    # Bancos y financieras
    "GFNORTEO.MX": Banorte
    "BBAJIOO.MX": BanBajío
    "GFINBURO.MX": Inbursa
    # Grandes emisoras
    "WALMEX.MX": Walmart de México
    "AMXB.MX": América Móvil
    "FEMSAUBD.MX": FEMSA
    "GMEXICOB.MX": Grupo México
    "CEMEXCPO.MX": Cemex
    # FIBRAs (bienes raíces)
    "FUNO11.MX": Fibra Uno
    "FIBRAMQ12.MX": Fibra Macquarie

macro:
  banxico:
    # Catálogo: https://www.banxico.org.mx/SieAPIRest/service/v1/doc/catalogoSeries
    SF43718: Tipo de cambio FIX
    SF61745: Tasa objetivo Banxico
    SF60648: TIIE 28 días
    SF60633: CETES 28 días
    SP68257: Valor de la UDI

  fred:
    # Catálogo: https://fred.stlouisfed.org
    DFF: Tasa de fondos federales (efectiva)
    DGS10: Bono del Tesoro EE. UU. 10 años
    CPIAUCSL: Inflación EE. UU. (índice CPI)
    UNRATE: Desempleo EE. UU.

noticias:
  # Feeds RSS de medios (verificados el 2026-10-29).
  feeds:
    El Financiero (economía): https://www.elfinanciero.com.mx/arc/outboundfeeds/rss/category/economia/?outputType=xml
    El Financiero (mercados): https://www.elfinanciero.com.mx/arc/outboundfeeds/rss/category/mercados/?outputType=xml
    El Financiero (empresas): https://www.elfinanciero.com.mx/arc/outboundfeeds/rss/category/empresas/?outputType=xml
    El Economista: https://www.eleconomista.com.mx/rss/ultimas-noticias
    Expansión (economía): https://expansion.mx/rss/economia
    Fed (política monetaria): https://www.federalreserve.gov/feeds/press_monetary.xml
    CNBC (mercados): https://www.cnbc.com/id/20910258/device/rss/rss.html
    MarketWatch: https://feeds.content.dowjones.io/public/rss/mw_topstories

  # Búsquedas en Google Noticias. La clave puede ser un ticker de la lista de
  # precios (para ligar la noticia con la emisora) o un tema libre.
  # Usa nombres completos: "Banorte" a secas trae notas del Estadio Banorte.
  busquedas:
    banxico: Banxico OR "Banco de México" tasa
    peso: '"peso mexicano" OR "tipo de cambio" dólar'
    bmv: '"Bolsa Mexicana" OR BMV OR "S&P/BMV IPC"'
    banca: CNBV OR "banca múltiple" OR "sistema bancario" México
    GFNORTEO.MX: '"Grupo Financiero Banorte" OR GFNORTE'
    BBAJIOO.MX: BanBajío OR "Banco del Bajío"
    GFINBURO.MX: '"Grupo Financiero Inbursa" OR GFINBUR'
    WALMEX.MX: '"Walmart de México" OR Walmex'
    AMXB.MX: '"América Móvil"'
    FEMSAUBD.MX: FEMSA OR OXXO
    GMEXICOB.MX: '"Grupo México"'
    CEMEXCPO.MX: Cemex
    FUNO11.MX: '"Fibra Uno" OR FUNO'
    FIBRAMQ12.MX: '"Fibra Macquarie" OR FIBRAMQ'
  dias_busqueda: 2   # antigüedad máxima de las notas en Google Noticias

analisis:
  activo: true                  # false para no gastar en la API
  modelo: claude-haiku-5-5
  precio_usd_por_millon:        # para estimar el gasto (verificar en la consola de Anthropic)
    entrada: 0.10
    salida: 0.50
  horas_atras: 48               # solo analiza notas publicadas en este periodo
  notas_por_llamada: 20
  maximo_por_corrida: 400       # tope de seguridad de gasto por corrida
